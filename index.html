<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Interface</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#202123;height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#f7f7f8;border-right:1px solid #e5e5e5;padding:14px;display:flex;flex-direction:column}
.new{border:1px solid #ddd;background:#fff;border-radius:8px;padding:11px 13px;font-size:14px;cursor:pointer;text-align:left}
.new:hover{background:#eee}
.history{margin-top:25px;color:#777;font-size:12px;padding:0 8px}
.item{padding:10px 8px;border-radius:7px;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover{background:#ececec}
.bottom{margin-top:auto;border-top:1px solid #ddd;padding-top:12px}
.profile{padding:10px 8px;font-size:14px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:58px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 24px;font-weight:600}
.logo{width:28px;height:28px;background:#111;border-radius:50%;color:#fff;display:grid;place-items:center;margin-right:10px;font-size:14px}
.chat{flex:1;overflow:auto;padding:40px 20px 150px}
.content{max-width:760px;margin:auto}
.welcome{text-align:center;margin-top:13vh}
.welcome h1{font-size:32px;margin-bottom:30px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:1px solid #ddd;border-radius:10px;padding:16px;text-align:left;cursor:pointer}
.card:hover{background:#f7f7f7}
.card b{display:block;margin-bottom:7px}
.card span{color:#777;font-size:13px}
.message{display:none;margin:20px 0}
.bubble{padding:14px 17px;border-radius:12px;background:#f7f7f8;line-height:1.5}
.composer{position:fixed;bottom:0;left:260px;right:0;padding:20px;background:linear-gradient(transparent,#fff 35%)}
.inputbox{max-width:760px;margin:auto;border:1px solid #d9d9d9;border-radius:14px;background:#fff;display:flex;align-items:center;padding:8px 10px;box-shadow:0 2px 12px #0000000d}
textarea{border:0;outline:0;resize:none;flex:1;font:inherit;padding:9px;max-height:130px}
.send{width:36px;height:36px;border:0;border-radius:9px;background:#111;color:#fff;cursor:pointer}
.send:disabled{background:#ddd}
@media(max-width:700px){
.sidebar{display:none}.composer{left:0}.header{padding:0 16px}
.cards{grid-template-columns:1fr}.chat{padding-left:15px;padding-right:15px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <button class="new" onclick="newChat()">＋ New chat</button>
  <div class="history">TODAY</div>
  <div class="item">Website design ideas</div>
  <div class="item">Help me plan a project</div>
  <div class="item">Creative brainstorming</div>
  <div class="bottom">
    <div class="profile">⚙ Settings</div>
    <div class="profile">◯ Your account</div>
  </div>
</aside>

<main class="main">
  <header class="header">
    <div class="logo">✦</div>
    AI Assistant
  </header>

  <section class="chat" id="chat">
    <div class="content">
      <div class="welcome" id="welcome">
        <h1>How can I help you?</h1>
        <div class="cards">
          <div class="card" onclick="suggest('Help me brainstorm some ideas')">
            <b>✦ Brainstorm</b><span>Explore ideas and possibilities</span>
          </div>
          <div class="card" onclick="suggest('Write a creative story')">
            <b>✎ Write</b><span>Create something from scratch</span>
          </div>
          <div class="card" onclick="suggest('Explain something to me')">
            <b>◈ Learn</b><span>Understand complex topics</span>
          </div>
          <div class="card" onclick="suggest('Help me solve a problem')">
            <b>⌁ Solve</b><span>Work through a challenge</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="composer">
    <div class="inputbox">
      <textarea id="input" rows="1" placeholder="Message AI Assistant..."
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send" id="send" onclick="send()">↑</button>
    </div>
  </div>
</main>

<script>
const input=document.getElementById("input");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");

function suggest(text){input.value=text;input.focus()}
function newChat(){location.reload()}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}
});

function send(){
  const text=input.value.trim();
  if(!text)return;

  welcome.style.display="none";

  const user=document.createElement("div");
  user.className="message";
  user.style.display="block";
  user.innerHTML=`<div style="font-weight:600;margin-bottom:7px">You</div>
                  <div>${escapeHTML(text)}</div>`;
  chat.querySelector(".content").appendChild(user);

  input.value="";
  input.style.height="auto";

  setTimeout(()=>{
    const ai=document.createElement("div");
    ai.className="message";
    ai.style.display="block";
    ai.innerHTML=`<div style="font-weight:600;margin-bottom:7px">✦ AI Assistant</div>
                  <div class="bubble">I’m a demo interface, but this is where an AI response would appear. Connect your preferred AI API to make the chat fully functional.</div>`;
    chat.querySelector(".content").appendChild(ai);
    chat.scrollTop=chat.scrollHeight;
  },500);

  chat.scrollTop=chat.scrollHeight;
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[c]));
}
</script>
</body>
</html>
